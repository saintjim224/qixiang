name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 编译 · 回归测试 · 前端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic numpy scipy pandas \
                      scikit-learn xgboost shap requests pytest httpx
          # pulearn / spei 仅用于第三方交叉校验对照行，缺失时对应行显示"跳过"，不阻断主链
          pip install pulearn spei \
            || echo "::warning title=可选依赖::pulearn/spei 未安装，PU 第 4 行对照与 SPI 交叉校验行将显示跳过"

      - name: 语法编译检查
        run: python -m compileall -q app tools tests

      - name: Python 回归测试
        run: python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 前端语法检查
        run: find frontend/js -name '*.js' -exec node --check {} +

      - name: 前端回归测试
        run: node --test tests/frontend_state.test.js tests/frontend_charts.test.js
